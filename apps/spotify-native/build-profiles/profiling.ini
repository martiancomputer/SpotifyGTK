# Profiling track -- for heaptrack, perf and friends.
#
# Same audio backend as stable, built so a profiler can attribute an
# allocation to the function that asked for it. Against the release build
# every heaptrack entry resolves to g_malloc inside libglib and stops there:
# with -O2 and no frame pointers there is no chain back to our own frames.
#
#   -g                        symbols, so a frame has a name
#   -fno-omit-frame-pointer   so the unwinder can walk out of glib into us
#   -O1                       optimised enough to behave like the real thing,
#                             not so much that callers are inlined away
#
# Usage:
#   meson setup build-prof --native-file build-profiles/profiling.ini
#   ninja -C build-prof
#   cd build-prof/src && heaptrack ./spotify-native

[built-in options]
buildtype = 'debugoptimized'
c_args    = ['-g', '-fno-omit-frame-pointer', '-O1']
c_link_args = ['-fno-omit-frame-pointer', '-rdynamic']
debug     = true
optimization = '1'

[project options]
profile         = 'stable'
enable_pipewire = false
