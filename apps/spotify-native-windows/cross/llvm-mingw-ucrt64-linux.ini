# Set PKG_CONFIG_LIBDIR to the downloaded MSYS2 UCRT64 lib/pkgconfig directory and
# PKG_CONFIG_SYSROOT_DIR to its parent (containing ucrt64). Keep native build
# tools on PKG_CONFIG_LIBDIR_FOR_BUILD, with SYSROOT_DIR_FOR_BUILD=/.
[binaries]
c = 'x86_64-w64-mingw32-clang'
cpp = 'x86_64-w64-mingw32-clang++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = 'pkg-config'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-D_UCRT']
c_link_args = ['-mwindows']
