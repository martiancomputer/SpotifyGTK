# Meson cross file: Linux host -> Windows x86_64, via mingw-w64.
#
# This exists mainly as a compile check. Producing a runnable bundle this way
# also needs mingw builds of glib/gtk4/libadwaita/libsoup3/json-glib/openssl/
# ogg/vorbis on the pkg-config path; without them `meson setup` will fail at
# dependency resolution rather than at compile, which is the expected outcome
# on a machine that only has mingw-w64-gcc.
#
# Building under MSYS2 UCRT64 on Windows itself needs no cross file at all --
# see README.md.

[binaries]
c          = 'x86_64-w64-mingw32-gcc'
cpp        = 'x86_64-w64-mingw32-g++'
ar         = 'x86_64-w64-mingw32-ar'
strip      = 'x86_64-w64-mingw32-strip'
windres    = 'x86_64-w64-mingw32-windres'
pkg-config = 'x86_64-w64-mingw32-pkg-config'

[host_machine]
system     = 'windows'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'

[built-in options]
# -mwindows keeps a console window from appearing behind the GUI. Drop it (or
# pass -mconsole) when you want the g_message/g_warning stream visible, which
# is most of the time while this port is unproven.
c_link_args = ['-mwindows']
