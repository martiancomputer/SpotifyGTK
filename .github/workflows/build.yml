name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  spotify-connect:
    name: spotify-connect (${{ matrix.profile }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 is not a target: it ships libadwaita 1.1.7 and both apps
          # require >= 1.4, which no amount of CI setup can work around. It was
          # in this matrix while the README claimed 22.04 support, and both were
          # wrong together.
          - profile: stable
            os: ubuntu-24.04
          - profile: nightly
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            libsoup-3.0-dev libjson-glib-dev \
            libsecret-1-dev libglib2.0-dev \
            libjpeg-turbo8-dev

      # Ubuntu 22.04 ships Meson 0.61 and the project needs >= 1.0, so take it
      # from pip rather than apt. That is also what a 22.04 user has to do, so
      # the CI environment matches the one the README documents.
      - name: Install Meson
        run: |
          pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install nightly-only dependencies
        if: matrix.profile == 'nightly'
        run: sudo apt-get install -y libva-dev libva-drm2

      - name: Configure (Meson)
        working-directory: apps/spotify-connect
        run: meson setup build --native-file build-profiles/${{ matrix.profile }}.ini -Dtests=true

      - name: Build
        working-directory: apps/spotify-connect
        run: ninja -C build

      - name: Run tests
        working-directory: apps/spotify-connect
        run: meson test -C build --print-errorlogs

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotify-connect-logs-${{ matrix.profile }}-${{ matrix.os }}
          path: apps/spotify-connect/build/meson-logs/

  spotify-native:
    name: spotify-native (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [stable, nightly]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ninja-build pkg-config \
            libglib2.0-dev libsoup-3.0-dev libjson-glib-dev \
            libgtk-4-dev libadwaita-1-dev \
            libogg-dev libvorbis-dev \
            libssl-dev libpulse-dev libasound2-dev

      # Ubuntu 22.04 ships Meson 0.61 and the project needs >= 1.0, so take it
      # from pip rather than apt. That is also what a 22.04 user has to do, so
      # the CI environment matches the one the README documents.
      - name: Install Meson
        run: |
          pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install nightly-only dependencies
        if: matrix.profile == 'nightly'
        run: sudo apt-get install -y libpipewire-0.3-dev

      # allow_old_gtk because the runner has GTK 4.14 and the UI is laid out
      # against 4.22. This job compiles and runs tests; it never looks at a
      # window, so the layout difference the floor guards against cannot affect
      # what it verifies. A build meant for a person to use must not set this.
      - name: Configure (Meson)
        working-directory: apps/spotify-native
        run: |
          meson setup build --native-file build-profiles/${{ matrix.profile }}.ini \
            -Dtests=true -Dallow_old_gtk=true

      - name: Build
        working-directory: apps/spotify-native
        run: ninja -C build

      - name: Run tests
        working-directory: apps/spotify-native
        run: meson test -C build --print-errorlogs

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotify-native-logs-${{ matrix.profile }}
          path: apps/spotify-native/build/meson-logs/

  lint:
    name: Lint (cppcheck)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unknownMacro \
            --suppress=syntaxError \
            --suppress=variableScope \
            --suppress=constParameterPointer \
            --suppress=constVariablePointer \
            -i apps/spotify-connect/src/vendor \
            apps/spotify-connect/src apps/spotify-native/src
