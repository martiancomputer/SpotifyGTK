name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  linux:
    name: Linux (pinned GTK fork)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GTK build and application dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-pip gettext \
            libglib2.0-dev libadwaita-1-dev libgdk-pixbuf-2.0-dev \
            libcairo2-dev libpango1.0-dev libharfbuzz-dev libepoxy-dev \
            libgraphene-1.0-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libx11-dev libxext-dev libxrender-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxcomposite-dev libxdamage-dev \
            libdrm-dev libvulkan-dev libjpeg-dev libpng-dev libtiff-dev \
            libsoup-3.0-dev libjson-glib-dev libogg-dev libvorbis-dev \
            libssl-dev libpulse-dev libasound2-dev libsecret-1-dev

      - name: Install Meson
        run: |
          python3 -m pip install --user --break-system-packages meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the pinned GTK fork and native application
        env:
          GTK_BUILD_JOBS: 2
          GTK_CONSUMER_TESTS: 'false'
          GTK_ALLOW_OLD_LIBADWAITA: 'true'
        run: packaging/build-enhanced-gtk.sh

      - name: Verify the application uses the pinned GTK build
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/_stage/gtk4-enhanced/usr/lib/pkgconfig"
          test "$(pkg-config --variable=libdir gtk4)" = "$GITHUB_WORKSPACE/_stage/gtk4-enhanced/usr/lib"
          test "$(pkg-config --modversion gtk4)" = "$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" dependencies/gtk4-enhanced/meson.build | head -1)"
          readelf -d apps/spotify-native/build/src/spotify-native | grep -F "$GITHUB_WORKSPACE/_stage/gtk4-enhanced/usr/lib"

      - name: Build native engine tests without UI tests
        run: |
          meson setup _build/native-tests apps/spotify-native \
            --native-file apps/spotify-native/build-profiles/stable.ini \
            --buildtype=debugoptimized -Denable_gui=false -Dtests=true
          meson compile -C _build/native-tests
          meson test -C _build/native-tests --print-errorlogs

      - name: Build and test Spotify Connect against the pinned GTK fork
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/_stage/gtk4-enhanced/usr/lib/pkgconfig
        run: |
          meson setup apps/spotify-connect/build apps/spotify-connect \
            --native-file apps/spotify-connect/build-profiles/stable.ini \
            --buildtype=debugoptimized -Dtests=true
          test "$(pkg-config --variable=libdir gtk4)" = "$GITHUB_WORKSPACE/_stage/gtk4-enhanced/usr/lib"
          meson compile -C apps/spotify-connect/build
          meson test -C apps/spotify-connect/build --print-errorlogs

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: |
            apps/spotify-native/build/meson-logs/
            _build/native-tests/meson-logs/
            apps/spotify-connect/build/meson-logs/

  windows-cross:
    name: Windows (pinned GTK fork, UCRT64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross-build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-pip gettext \
            mingw-w64 gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            wine wine64 osslsigncode \
            libglib2.0-dev libadwaita-1-dev libgdk-pixbuf-2.0-dev \
            libcairo2-dev libpango1.0-dev libharfbuzz-dev libepoxy-dev \
            libgraphene-1.0-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libx11-dev libxext-dev libxrender-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxcomposite-dev libxdamage-dev \
            libdrm-dev libvulkan-dev libjpeg-dev libpng-dev libtiff-dev
          python3 -m pip install --user --break-system-packages meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch the isolated UCRT64 build SDK
        run: python3 apps/spotify-native-windows/fetch-msys-runtime.py apps/spotify-native-windows/tools-build/msys-runtime

      - name: Build the pinned Windows GTK fork
        env:
          GTK_BUILD_JOBS: 2
        run: bash apps/spotify-native-windows/build-enhanced-gtk.sh

      - name: Build Windows application against the pinned GTK fork
        run: |
          root="$GITHUB_WORKSPACE"
          base="$root/apps/spotify-native-windows/tools-build/gtk4-enhanced-runtime"
          export prefix="$base/ucrt64"
          export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig:$prefix/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$base"
          export SPOTIFYGTK_CROSS_FILE="$root/apps/spotify-native-windows/cross/msys2-ucrt64-linux.ini"
          bash apps/spotify-native-windows/build.sh
          test "$(PKG_CONFIG_LIBDIR="$PKG_CONFIG_LIBDIR" PKG_CONFIG_SYSROOT_DIR="$PKG_CONFIG_SYSROOT_DIR" pkg-config --variable=libdir gtk4)" = /ucrt64/lib
          objdump -p apps/spotify-native-windows/build/src/spotify-native.exe | grep -i 'DLL Name: libgtk-4-1.dll'

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cross-build-logs
          path: apps/spotify-native-windows/build/meson-logs/

  lint:
    name: Lint (cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unknownMacro \
            --suppress=syntaxError \
            --suppress=variableScope \
            --suppress=constParameterPointer \
            --suppress=constVariablePointer \
            -i apps/spotify-connect/src/vendor \
            apps/spotify-connect/src apps/spotify-native/src
