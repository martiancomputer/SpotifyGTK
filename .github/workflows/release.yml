name: Release

# Tagging is what publishes. workflow_dispatch is here so the packaging can be
# exercised without creating a tag -- the artifacts are built and uploaded to
# the run, but no release is created, so a broken package cannot become a
# published one by accident.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: deb (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ninja-build pkg-config dpkg-dev desktop-file-utils \
            libgtk-4-dev libadwaita-1-dev \
            libglib2.0-dev libsoup-3.0-dev libjson-glib-dev \
            libogg-dev libvorbis-dev \
            libssl-dev libpulse-dev libasound2-dev

      - name: Install Meson
        run: |
          pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: ./packaging/build-deb.sh

      # The runner cannot satisfy this package's own requirement -- 24.04 has
      # GTK 4.14 and the package asks for 4.22 -- so a plain apt install would
      # fail by design and prove nothing. Unpack it with --force-depends
      # instead: that still verifies the payload lands correctly, while the
      # dependency line is asserted separately rather than by installing.
      - name: Verify the package
        run: |
          echo "--- declared dependencies ---"
          dpkg-deb --field ./packaging/out/*.deb Depends | tr ',' '\n' | sed 's/^ *//'

          if ! dpkg-deb --field ./packaging/out/*.deb Depends | grep -q "libgtk-4-1 (>= 4.22"; then
            echo "::error::package does not require GTK >= 4.22, so it would install where the UI looks wrong"
            exit 1
          fi

          sudo dpkg -i --force-depends ./packaging/out/*.deb
          dpkg -L spotifygtk
          desktop-file-validate /usr/share/applications/com.github.spotifygtk.SpotifyNative.desktop
          test -x /usr/bin/spotify-native
          echo "payload correct; dependency floor present"

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packaging/out/*.deb

  appimage:
    name: AppImage (GTK 4.22+)
    runs-on: ubuntu-24.04
    container: fedora:rawhide
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK toolchain and packaging tools
        run: |
          dnf -y install git gcc gcc-c++ meson ninja-build pkgconf-pkg-config \
            gtk4-devel libadwaita-devel libsoup3-devel json-glib-devel \
            libogg-devel libvorbis-devel openssl-devel libjpeg-turbo-devel \
            libpng-devel glib-networking curl file fuse-libs desktop-file-utils \
            fontconfig patchelf squashfs-tools
      - name: Verify designed GTK stack
        run: |
          gtk=$(pkg-config --modversion gtk4)
          adw=$(pkg-config --modversion libadwaita-1)
          echo "GTK $gtk; libadwaita $adw"
          test "$(printf '%s\n' 4.22.4 "$gtk" | sort -V | head -1)" = 4.22.4
          test "$(printf '%s\n' 1.9.0 "$adw" | sort -V | head -1)" = 1.9.0
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: packaging/out/*.AppImage

  msix:
    name: MSIX (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-json-glib mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libogg mingw-w64-ucrt-x86_64-libvorbis curl
      - name: Verify designed GTK stack
        run: |
          gtk=$(pkg-config --modversion gtk4)
          adw=$(pkg-config --modversion libadwaita-1)
          echo "GTK $gtk; libadwaita $adw"
          test "$(printf '%s\n' 4.22.4 "$gtk" | sort -V | head -1)" = 4.22.4
          test "$(printf '%s\n' 1.9.0 "$adw" | sort -V | head -1)" = 1.9.0
      - name: Build portable Windows bundle
        run: ./apps/spotify-native-windows/build.sh --bundle
      - name: Package MSIX
        shell: pwsh
        run: ./packaging/build-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: packaging/out/*.msix

  publish:
    name: Publish release
    needs: [deb, appimage, msix]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      # Needed for the notes file; the artifacts alone are not a checkout.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { path: dist }

      # Keep the repository's release staging layout explicit. Generated
      # binaries are never committed back to main (that would make every tag
      # grow the repository); this directory is the canonical local layout and
      # the same files are attached to the GitHub Release below.
      - name: Stage release packages
        run: |
          mkdir -p "releases/$GITHUB_REF_NAME"
          find dist -type f -maxdepth 3 -exec cp -f {} "releases/$GITHUB_REF_NAME/" \;
          find "releases/$GITHUB_REF_NAME" -type f -printf '%f\n' | sort

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | sort
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SpotifyGTK $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md \
            $(find dist -type f)
