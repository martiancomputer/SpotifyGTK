name: Release

# Tagging is what publishes. workflow_dispatch is here so the packaging can be
# exercised without creating a tag -- the artifacts are built and uploaded to
# the run, but no release is created, so a broken package cannot become a
# published one by accident.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The AppImage is not built here. It bundles the GTK stack, so the build
  # host's version becomes the runtime version, and no runner base has the
  # GTK 4.22 the UI is laid out against -- it would only ever produce the
  # older-toolkit look. It is built by hand from packaging/build-appimage.sh on
  # a machine that does, and attached to the release separately.
  #
  # The deb has no such problem: it links the system GTK at runtime rather than
  # bundling it, so where it is built does not decide how it looks. It declares
  # the version it needs instead.
  deb:
    name: deb (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ninja-build pkg-config dpkg-dev desktop-file-utils \
            libgtk-4-dev libadwaita-1-dev \
            libglib2.0-dev libsoup-3.0-dev libjson-glib-dev \
            libogg-dev libvorbis-dev \
            libssl-dev libpulse-dev libasound2-dev

      - name: Install Meson
        run: |
          pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: ./packaging/build-deb.sh

      # The runner cannot satisfy this package's own requirement -- 24.04 has
      # GTK 4.14 and the package asks for 4.22 -- so a plain apt install would
      # fail by design and prove nothing. Unpack it with --force-depends
      # instead: that still verifies the payload lands correctly, while the
      # dependency line is asserted separately rather than by installing.
      - name: Verify the package
        run: |
          echo "--- declared dependencies ---"
          dpkg-deb --field ./packaging/out/*.deb Depends | tr ',' '\n' | sed 's/^ *//'

          if ! dpkg-deb --field ./packaging/out/*.deb Depends | grep -q "libgtk-4-1 (>= 4.22"; then
            echo "::error::package does not require GTK >= 4.22, so it would install where the UI looks wrong"
            exit 1
          fi

          sudo dpkg -i --force-depends ./packaging/out/*.deb
          dpkg -L spotifygtk
          desktop-file-validate /usr/share/applications/com.github.spotifygtk.SpotifyNative.desktop
          test -x /usr/bin/spotify-native
          echo "payload correct; dependency floor present"

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packaging/out/*.deb

  publish:
    name: Publish release
    needs: [deb]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      # Needed for the notes file; the artifacts alone are not a checkout.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { path: dist }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | sort
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SpotifyGTK $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md \
            $(find dist -type f)
